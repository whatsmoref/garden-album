name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    # 用 22.04 + 自建 ORT：预编译的 libonnxruntime.so 链的是 glibc 2.39，
    # 本机/22.04 是 glibc 2.35，直接跑会报 GLIBC_2.38 not found。
    # 换 ubuntu-24.04 编译后二进制同样在本机跑不起来，所以必须在 22.04 上从源码编 ORT。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install ONNX Runtime (prebuilt wheel)
        run: |
          set -euo pipefail
          # pip 的 onnxruntime wheel 里带的 .so 只需要 GLIBC_2.27，
          # 而 ort crate 的 download-binaries 下的是 glibc 2.39 构建 —— 两者不同源。
          # 所以：自己下 wheel、取出 .so、放到 ORT_LIB_LOCATION，让 ort-sys 静态链它。
          pip download 'onnxruntime==1.23.2' -d /tmp/ortwhl --no-deps -q
          mkdir -p /opt/ort-install/lib
          python3 - <<'PYEOF'
          import zipfile, glob, shutil, os
          w = glob.glob('/tmp/ortwhl/*.whl')[0]
          z = zipfile.ZipFile(w)
          for n in z.namelist():
              if n.endswith('libonnxruntime.so.1.23.2') or n.endswith('libonnxruntime_providers_shared.so'):
                  dst = '/opt/ort-install/lib/' + os.path.basename(n)
                  with z.open(n) as src, open(dst, 'wb') as out:
                      shutil.copyfileobj(src, out)
                  print('extracted', dst, os.path.getsize(dst))
          PYEOF
          ln -sf /opt/ort-install/lib/libonnxruntime.so.1.23.2 /opt/ort-install/lib/libonnxruntime.so
          sudo ldconfig
          echo "--- so 需要的最高 glibc 符号 ---"
          objdump -T /opt/ort-install/lib/libonnxruntime.so.1.23.2 | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1

      - name: Build release
        run: cargo build --release
        env:
          ORT_LIB_LOCATION: /opt/ort-install/lib
          # 只有 .so，没有 .a；必须让 ort-sys 走动态链接分支
          ORT_PREFER_DYNAMIC_LINK: "1"
          LD_LIBRARY_PATH: /opt/ort-install/lib

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/album dist/album
          cp /opt/ort-install/lib/libonnxruntime.so* dist/
          # 静态链入的 ORT 不需要额外 .so；只记录依赖与 glibc 要求便于排查
          ldd dist/album | awk '/=> \//{print $3}' | sort -u > dist/ldd.txt || true
          echo "--- max GLIBC symbol version ---"
          objdump -T dist/album | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 | tee dist/glibc.txt
          # 本地 glibc 2.35，不能高于它
          MAX=$(cat dist/glibc.txt | tr -d 'GLIBC_')
          python3 - <<'EOF'
          import sys
          v = open('dist/glibc.txt').read().strip().replace('GLIBC_','')
          parts = [int(x) for x in v.split('.')]
          print('binary needs GLIBC', v)
          if parts >= [2, 36]:
              print('ERROR: 需要 glibc >= 2.36，本机 2.35 跑不了')
              sys.exit(1)
          print('OK: 兼容本机 glibc 2.35')
          EOF
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: album-linux-x86_64
          path: dist/
          retention-days: 30

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2

      - name: Install ONNX Runtime (prebuilt wheel)
        run: |
          set -euo pipefail
          pip download 'onnxruntime==1.23.2' -d /tmp/ortwhl --no-deps -q
          mkdir -p /opt/ort-install/lib
          python3 - <<'PYEOF'
          import zipfile, glob, shutil, os
          w = glob.glob('/tmp/ortwhl/*.whl')[0]
          z = zipfile.ZipFile(w)
          for n in z.namelist():
              if 'libonnxruntime.so' in n:
                  dst = '/opt/ort-install/lib/' + os.path.basename(n)
                  with z.open(n) as src, open(dst, 'wb') as out:
                      shutil.copyfileobj(src, out)
          PYEOF
          ln -sf /opt/ort-install/lib/libonnxruntime.so.1.23.2 /opt/ort-install/lib/libonnxruntime.so
          sudo ldconfig

      - name: cargo test
        run: cargo test --release
        env:
          ORT_LIB_LOCATION: /opt/ort-install/lib
          ORT_PREFER_DYNAMIC_LINK: "1"
          LD_LIBRARY_PATH: /opt/ort-install/lib
