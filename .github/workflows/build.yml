name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    # 用 22.04 + 自建 ORT：预编译的 libonnxruntime.so 链的是 glibc 2.39，
    # 在 22.04（2.35）跑不起来，且换新 glibc 的 ld.so 会引出 __tunable_is_initialized 冲突。
    # 正确做法是在 22.04 上从源码编译 ONNX Runtime（API 1.17+，静态链进二进制）。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Cache ONNX Runtime build
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ort-install
          key: ort-1.22.0-x64-linux-22.04
      - name: Build ONNX Runtime from source (glibc 2.35 compatible)
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # eigen3 的 CMake FetchContent 会被网络卡住，直接用 apt 的
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libeigen3-dev
          cd /tmp
          git clone --depth 1 -b v1.22.0 --recursive https://github.com/microsoft/onnxruntime.git
          cd onnxruntime
          ./build.sh --config Release --build_shared_lib --parallel --skip_tests \
            --update --compile_no_warning_as_error \
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF \
                                       onnxruntime_USE_OPENMP=OFF \
                                       ORT_LIB_LOCATION=/tmp/ort-install/lib
          mkdir -p /tmp/ort-install
          cp -r build/Linux/Release/onnxruntime /tmp/ort-install/
          cp include /tmp/ort-install/ 2>/dev/null || true
      - name: Point ort at the local ORT
        run: |
          echo "ORT_LIB_LOCATION=/tmp/ort-install/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/ort-install/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "ORT_DYLIB_PATH=/tmp/ort-install/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - name: Build release
        run: cargo build --release
        env:
          ORT_LIB_LOCATION: /tmp/ort-install/lib
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/album dist/album
          # ort 的 copy-dylibs 会把 libonnxruntime.so 放进 target/release/
          # 静态链入的 ORT 不需要额外 .so；只记录依赖便于排查
          ldd dist/album | awk '/=> \//{print $3}' | sort -u > dist/ldd.txt || true
          echo "--- 需要 GLIBC_2.xx ---"
          objdump -T dist/album | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: album-linux-x86_64
          path: dist/
          retention-days: 30

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ONNX Runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libonnxruntime-dev 2>/dev/null || {
            echo "apt 没有 libonnxruntime-dev，改用 python wheel 里的 .so"
            pip download onnxruntime==1.22.0 -d /tmp/ortwhl --no-deps -q
            mkdir -p /opt/ort && cd /tmp/ortwhl && python3 -c "
import zipfile,glob,os
w=glob.glob('*.whl')[0]
zipfile.ZipFile(w).extractall('/opt/ort')
"
            find /opt/ort -name 'libonnxruntime.so*' -exec cp -P {} /usr/local/lib/ \;
            ldconfig
          }
      - name: cargo test
        run: cargo test --release
