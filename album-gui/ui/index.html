<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Garden 照片</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="svg-defs" aria-hidden="true">
  <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.3" cy="9.4" r="1.4"/><path d="M21 15.4 16.6 11 7 20"/></symbol>
  <symbol id="i-memories" viewBox="0 0 24 24"><path d="M12 3.2l2.3 6 6.2.4-4.8 4 1.5 6.2L12 16.4l-5.2 3.4 1.5-6.2-4.8-4 6.2-.4z"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.6 20.4c0-4 3.4-6.4 7.4-6.4s7.4 2.4 7.4 6.4"/></symbol>
  <symbol id="i-place" viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
  <symbol id="i-clean" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4.4A1.4 1.4 0 0 1 9.4 3h5.2A1.4 1.4 0 0 1 16 4.4V6"/><path d="M6 6l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-duplicate" viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2.5"/><path d="M8 21h10.5A2.5 2.5 0 0 0 21 18.5V8"/></symbol>
  <symbol id="i-shot" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.2"/><path d="M4 10h16"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.4" r="3.4"/></symbol>
  <symbol id="i-burst" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.6" stroke-dasharray="2 3.2"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.7 4.8v6.1l9.4 9.4a2 2 0 0 0 2.8 0l4.4-4.4a2 2 0 0 0 0-2.8l-9.4-9.4H4.7a1 1 0 0 0-1 1z"/><circle cx="8" cy="8" r="1.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.6"/><path d="M20 20l-3.8-3.8"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11A8 8 0 0 0 6.3 6.3L4 8.5"/><path d="M4 4v4.5h4.5"/><path d="M4 13a8 8 0 0 0 13.7 4.7L20 15.5"/><path d="M20 20v-4.5h-4.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5.5 8.5 12l6.5 6.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5.5 8.5 12l6.5 6.5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5.5 15.5 12 9 18.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.2M12 7.8v.2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.2a2 2 0 0 1 2-2h3.4a2 2 0 0 1 1.4.6l1.2 1.2H18.5a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3.2 2"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11 12 15.5 16.5 11"/><path d="M5 19.5h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 6.5"/></symbol>
  <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M11 8v6M8 11h6"/></symbol>
  <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M8 11h6"/></symbol>
</svg>

<div class="welcome" id="welcome" hidden>
  <div class="welcome-card">
    <div class="welcome-mark"><img src="logo.svg" alt=""></div>
    <h1>选择照片文件夹</h1>
    <p class="welcome-lead">照片只在本地建立索引，不会上传。</p>
    <button class="welcome-btn" id="welcomePick"><svg class="ic"><use href="#i-folder"/></svg><span>选择文件夹</span></button>
    <div class="welcome-progress" id="welcomeProgress" hidden>
      <div class="welcome-track"><i id="welcomeBar"></i></div>
      <div class="welcome-status" id="welcomeStatus"></div>
      <button class="welcome-skip" id="welcomeContinue" hidden>在后台继续，稍后刷新查看</button>
    </div>
    <div class="welcome-path" id="welcomePath" hidden></div>
    <p class="welcome-note">支持 JPG、PNG、HEIC、WebP</p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="logo.svg" alt=""></div>
      <div class="brand-text"><b>Garden</b><span>照片</span></div>
      <button class="icon-btn brand-action" id="btnTheme" title="切换外观"><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>

    <div class="search-wrap">
      <div class="search" id="searchBox">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="q" placeholder="搜索照片、人物、地点" autocomplete="off" spellcheck="false" aria-label="搜索照片">
        <kbd>⌘K</kbd>
      </div>
      <div class="chips" id="chips"></div>
      <div class="search-note" id="searchNote"></div>
    </div>

    <nav class="nav-scroll">
      <div class="nav-title">照片</div>
      <button class="nav-item active" data-view="library"><svg class="ic"><use href="#i-library"/></svg><span>图库</span><em id="cLibrary"></em></button>
      <button class="nav-item" data-view="memories"><svg class="ic i-memory"><use href="#i-memories"/></svg><span>回忆</span><em id="cMemories"></em></button>
      <button class="nav-item" data-view="people"><svg class="ic i-people"><use href="#i-people"/></svg><span>人物</span><em id="cPeople"></em></button>
      <button class="nav-item" data-view="places"><svg class="ic i-place"><use href="#i-place"/></svg><span>地点</span><em id="cPlaces"></em></button>

      <div class="nav-title">智能</div>
      <button class="nav-item" data-view="clean"><svg class="ic i-clean"><use href="#i-clean"/></svg><span>清理建议</span><em id="cClean"></em></button>
      <button class="nav-item" data-view="dup"><svg class="ic i-dup"><use href="#i-duplicate"/></svg><span>重复项目</span><em id="cDup"></em></button>
      <button class="nav-item" data-view="shots"><svg class="ic"><use href="#i-shot"/></svg><span>截屏</span><em id="cShots"></em></button>
      <button class="nav-item" data-view="text"><svg class="ic"><use href="#i-text"/></svg><span>有文字</span><em id="cText"></em></button>
      <button class="nav-item" data-view="bursts"><svg class="ic"><use href="#i-burst"/></svg><span>连拍</span><em id="cBursts"></em></button>
      <button class="nav-item" data-view="tags"><svg class="ic"><use href="#i-tag"/></svg><span>标签</span><em id="cTags"></em></button>

      <div class="nav-title nav-title-row"><span>我的相簿</span><button class="nav-add" data-action="albumNew" title="新建相簿">+</button></div>
      <div id="albumNav"></div>
      <div class="album-actions">
        <button data-action="albumNew"><span>＋</span>新建相簿</button>
        <button data-action="albumImport"><svg class="ic"><use href="#i-folder"/></svg>从文件夹导入</button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <span class="pulse" id="pulse"></span>
      <span id="footText">正在连接本地索引…</span>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="toolbar-left">
        <button class="icon-btn" id="btnBack" title="返回图库"><svg class="ic"><use href="#i-back"/></svg></button>
        <div class="top-title" id="topTitle">图库</div>
      </div>

      <div class="toolbar-center">
        <div class="seg" id="segLayout" role="tablist" aria-label="网格视图">
          <button data-layout="all" role="tab">全部</button>
          <button data-layout="year" role="tab">年</button>
          <button data-layout="month" role="tab">月</button>
          <button data-layout="day" class="on" role="tab" aria-selected="true">日</button>
        </div>
      </div>

      <div class="toolbar-right">
        <div class="zoom-wrap" title="缩略图大小">
          <svg class="ic zoom-small"><use href="#i-library"/></svg>
          <input id="zoom" type="range" min="110" max="280" step="10" value="170" aria-label="缩略图大小">
          <svg class="ic zoom-big"><use href="#i-library"/></svg>
        </div>
        <button class="tool-select" id="btnSelect" title="批量选择照片"><svg class="ic"><use href="#i-check"/></svg><span>选择</span></button>
        <button class="icon-btn" id="btnSearch" title="搜索 (⌘K)"><svg class="ic"><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="btnRefresh" title="刷新当前视图 (⌘R)"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="btnMenu" title="更多"><svg class="ic"><use href="#i-more"/></svg></button>
      </div>
    </header>

    <div class="content" id="scroller">
      <div class="hero" id="hero">
        <div class="hero-main">
          <h1 id="pageTitle">图库</h1>
          <div class="meta" id="pageMeta"></div>
        </div>
        <div class="pills" id="pills"></div>
      </div>
      <div id="body" class="body"></div>
    </div>

    <div class="batchbar" id="batchBar" hidden>
      <span id="batchCount">已选 0 张</span>
      <button id="batchAddAlbum" class="primary">加入相簿</button>
      <button id="batchCancel">取消</button>
    </div>

    <footer class="statusbar">
      <span id="statusLeft">本地照片库</span>
      <span id="statusRight"></span>
    </footer>
  </main>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="照片预览">
  <header class="lb-top">
    <div class="lb-title" id="lbTitle"></div>
    <div class="lb-actions">
      <button class="lb-btn" id="lbZoomOut" title="缩小"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
      <button class="lb-btn lb-zoom-label" id="lbFitBtn" title="重置缩放"><span id="lbZoomLabel">适应</span></button>
      <button class="lb-btn" id="lbZoomIn" title="放大"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
      <button class="lb-btn" id="lbAlbumBtn" title="加入相簿"><svg class="ic"><use href="#i-folder"/></svg></button>
      <button class="lb-btn" id="lbInfoBtn" title="显示信息 (I)"><svg class="ic"><use href="#i-info"/></svg></button>
      <button class="lb-btn" id="lbOpenBtn" title="查看原图"><svg class="ic"><use href="#i-download"/></svg></button>
      <button class="lb-btn" id="lbClose" title="关闭 (Esc)"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
  </header>
  <div class="lb-body">
    <button class="lb-nav prev" id="lbPrev" title="上一张 (←)"><svg class="ic"><use href="#i-left"/></svg></button>
    <div class="lb-stage" id="lbStage">
      <div class="lb-loading" id="lbLoading"><span></span></div>
      <img id="lbImg" alt="" draggable="false">
    </div>
    <button class="lb-nav next" id="lbNext" title="下一张 (→)"><svg class="ic"><use href="#i-right"/></svg></button>
    <aside class="lb-info" id="lbInfo" hidden></aside>
  </div>
  <footer class="lb-foot">
    <span id="lbCounter"></span>
    <span class="lb-hint">← → 切换 · I 信息 · +/- 缩放 · 0 重置 · Esc 关闭</span>
  </footer>
</div>

<div class="popover" id="popover" hidden>
  <button data-act="refresh"><svg class="ic"><use href="#i-refresh"/></svg><span>刷新当前视图</span><kbd>⌘R</kbd></button>
  <button data-act="retag"><svg class="ic"><use href="#i-spark"/></svg><span>重建智能标签</span></button>
  <button data-act="index"><svg class="ic"><use href="#i-folder"/></svg><span>添加照片文件夹</span></button>
  <div class="pop-sep"></div>
  <button data-act="theme"><svg class="ic"><use href="#i-monitor"/></svg><span>跟随系统外观</span></button>
  <div class="pop-foot">Garden Photos · 本地运行</div>
</div>

<div class="ctx-menu" id="ctxMenu" hidden></div>

<div class="photo-menu" id="photoMenu" hidden role="menu" aria-label="照片操作">
  <button data-menu-act="view" role="menuitem"><svg class="ic"><use href="#i-library"/></svg><span>查看</span><kbd>Enter</kbd></button>
  <button data-menu-act="original" role="menuitem"><svg class="ic"><use href="#i-download"/></svg><span>查看原图</span></button>
  <div class="menu-sep"></div>
  <button data-menu-act="tags" role="menuitem"><svg class="ic"><use href="#i-tag"/></svg><span>标签…</span></button>
  <button data-menu-act="album" role="menuitem"><svg class="ic"><use href="#i-folder"/></svg><span>加入相簿…</span></button>
  <div class="menu-sep"></div>
  <button data-menu-act="select" role="menuitem"><svg class="ic"><use href="#i-check"/></svg><span>选择</span></button>
  <button data-menu-act="info" role="menuitem"><svg class="ic"><use href="#i-info"/></svg><span>显示信息</span><kbd>I</kbd></button>
</div>

<div class="toast" id="toast" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
